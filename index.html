<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>404 Not Found</title>
    <style>
        body {
            background-color: #fff;
            color: #000;
            font-family: "Arial", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Экран ошибки */
        #error-screen {
            display: block;
        }

        h1 { font-size: 48px; margin: 0; }
        .mod-text { color: #ff0000; font-weight: bold; text-decoration: underline; margin: 20px 0; }

        /* Экран поздравления */
        #congratulations {
            display: none;
            background-color: #000080; /* Классический синий из 2007 */
            color: #ffff00;
            padding: 50px;
            border: 5px double #ffffff;
        }

        /* Скрытая область в углу */
        #secret-button {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 100;
        }

        video {
            width: 320px;
            margin-top: 15px;
            border: 1px solid #ccc;
        }

        .mrca {
            width: 120px;
            display: block;
            margin: 10px auto;
        }
    </style>
</head>
<body>

    <!-- СТРАНИЦА ОШИБКИ -->
    <div id="error-screen">
        <h1>404 Not Found</h1>
        <div class="mod-text">УВЫ, ЭТОТ САЙТ УДАЛИЛ МОДЕРАТОР</div>
        <p>Вы можете послушать удивительную ковбойскую песню:</p>
        
        <img src="Mrca.png" alt="Moderator" class="mrca">
        
        <video controls autoplay loop>
            <source src="Cowboy.mp4" type="video/mp4">
        </video>
    </div>

    <!-- ПОЗДРАВЛЕНИЕ -->
    <div id="congratulations">
        <h2 style="font-size: 36px;">ПОЗДРАВЛЯЮ!</h2>
        <p>Надеюсь, Сэлли это увидит! ( ^ _ ^ )</p>
        <p>Стань круче Рингмастера!</p>
    </div>

    <!-- НЕВИДИМАЯ КНОПКА -->
    <div id="secret-button" onclick="showSecret()"></div>

    <script>
        function showSecret() {
            // Скрываем ошибку
            document.getElementById('error-screen').style.display = 'none';
            // Показываем поздравление
            document.getElementById('congratulations').style.display = 'block';
            // Меняем фон страницы на синий
            document.body.style.backgroundColor = "#000080";
        }
    </script>
</body>
</html>
