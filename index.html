<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>INDEX_RECOVERED</title>
    <style>
        body {
            background-color: #e0e0e0;
            font-family: "Tahoma", "Verdana", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Заглушка модератора */
        #moderator-layer {
            background: #fff;
            border: 1px solid #999;
            padding: 30px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }

        .alert-box {
            color: #ff0000;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #ff0000;
            padding: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Скрытая переписка */
        #lost-media-layer {
            display: none;
            background-color: #000022; 
            color: #00ff00; /* Зеленый терминальный цвет */
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0; left: 0;
            padding: 40px;
            box-sizing: border-box;
            text-align: left;
            font-family: "Courier New", monospace;
        }

        .chat-container {
            max-width: 600px;
            margin: 0 auto;
            border-left: 2px solid #004400;
            padding-left: 20px;
        }

        .msg {
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 18px;
            background: #00ff00;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Секретный угол */
        #trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            cursor: default;
            z-index: 9999;
        }

        img.mod-img { width: 120px; filter: grayscale(50%); margin: 10px; }
        video.mod-video { width: 300px; border: 1px solid #000; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: МОДЕРАТОР -->
    <div id="moderator-layer">
        <div class="alert-box">ВНИМАНИЕ: СТРАНИЦА УДАЛЕНА</div>
        <p>Доступ к данным ограничен.</p>
        
        <img src="Mrca.png" class="mod-img">
        
        <video class="mod-video" controls autoplay loop>
            <source src="Cowboy.mp4" type="video/mp4">
        </video>
        <p style="font-size: 12px; color: #666; margin-top: 15px;">Ошибка 404: Данные не найдены</p>
    </div>

    <!-- ЭКРАН 2: LOST MEDIA ПЕРЕПИСКА -->
    <div id="lost-media-layer">
        <div style="color: #666; margin-bottom: 30px; font-size: 12px;">
            ПОДКЛЮЧЕНИЕ К СЕРВЕРУ... УСПЕШНО.<br>
            ИЗВЛЕЧЕНИЕ ПАКЕТОВ ДАННЫХ... ГОТОВО.
        </div>

        <div class="chat-container">
            <div class="msg">— город затих</div>
            <div class="msg">— маяки не отвечают</div>
            <div class="msg">— стоит ли обращаться к Маякистору?</div>
            <div class="msg">— он уже не поможет</div>
            <div class="msg">— думаешь?</div>
            <div class="msg">— эй?</div>
            <div class="msg">— <span class="cursor"></span></div>
        </div>
    </div>

    <div id="trigger" onclick="openArchive()"></div>

    <script>
        function openArchive() {
            document.getElementById('moderator-layer').style.display = 'none';
            document.getElementById('lost-media-layer').style.display = 'block';
            document.body.style.backgroundColor = "#000022";
        }
    </script>
</body>
</html>
