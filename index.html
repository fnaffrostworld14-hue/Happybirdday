<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Страница удалена</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: "Tahoma", sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Заглушка */
        #error-page {
            text-align: center;
            color: #333;
        }
        .error-msg {
            color: #ff0000;
            font-size: 22px;
            font-weight: bold;
            text-decoration: underline;
            margin-bottom: 20px;
        }

        /* Лаконичное поздравление */
        #secret-site {
            display: none;
            background-color: #000080;
            color: #ffff00;
            font-family: "Comic Sans MS", cursive;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            text-align: center;
            padding-top: 150px;
        }

        .main-box {
            border: 3px double #ffffff;
            display: inline-block;
            padding: 40px;
            background: #000080;
        }

        /* Секретный угол */
        #trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: МОДЕРАТОР -->
    <div id="error-page">
        <div class="error-msg">УВЫ, ЭТОТ САЙТ УДАЛИЛ МОДЕРАТОР</div>
        <p>Вы можете послушать удивительную ковбойскую песню:</p>
        <img src="Mrca.png" style="width: 150px; display: block; margin: 10px auto;">
        <video controls autoplay loop style="width: 320px;">
            <source src="Cowboy.mp4" type="video/mp4">
        </video>
    </div>

    <!-- ЭКРАН 2: УРЕЗАННОЕ ПОЗДРАВЛЕНИЕ -->
    <div id="secret-site">
        <div class="main-box">
            <h1 style="text-transform: uppercase;">Поздравляю!</h1>
            <p>Надеюсь, Сэлли это увидит! ( ^ _ ^ )</p>
            <p>Стань круче Рингмастера!</p>
        </div>
    </div>

    <div id="trigger" onclick="openSecret()"></div>

    <script>
        function openSecret() {
            document.getElementById('error-page').style.display = 'none';
            document.getElementById('secret-site').style.display = 'block';
            document.body.style.backgroundColor = "#000080";
        }
    </script>
</body>
</html>
